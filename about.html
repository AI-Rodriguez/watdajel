<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — Watdajel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0F0F0F;--charcoal:#1A1A1A;--g600:#6B6B6B;--g200:#E0E0E0;--g100:#F5F5F5;--warm:#F8F6F3;--white:#FFF;--burgundy:#6B1D3A;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',-apple-system,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);color:var(--charcoal);background:var(--white);min-height:100vh;display:flex;flex-direction:column}
.n{background:rgba(255,255,255,.96);backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.06);position:fixed;top:0;left:0;right:0;z-index:100}
.n-i{max-width:1320px;margin:0 auto;padding:0 48px;height:72px;display:flex;align-items:center;justify-content:space-between}
.n-logo{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.02em;text-decoration:none;color:var(--burgundy)}
.n-back{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--g600);text-decoration:none;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:50px;border:1.5px solid var(--g200);transition:all .25s}
.n-back:hover{color:var(--charcoal);border-color:var(--charcoal)}
.page-body{flex:1;display:flex;align-items:center;justify-content:center;padding:120px 48px 80px;background:var(--warm)}
.page-center{max-width:640px;text-align:center}
.page-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--burgundy);margin-bottom:24px}
.page-title{font-family:var(--serif);font-size:clamp(40px,6vw,72px);font-weight:500;font-style:italic;color:var(--charcoal);line-height:1.05;letter-spacing:-.02em;margin-bottom:24px}
.page-sub{font-family:var(--sans);font-size:17px;color:var(--g600);margin-bottom:48px;line-height:1.7}
.page-note{font-family:var(--sans);font-size:14px;color:var(--g600);font-style:italic;border-top:1px solid var(--g200);padding-top:32px;margin-top:32px}
</style>
</head>
<body>
<nav class="n">
  <div class="n-i">
    <a href="index.html" class="n-logo">Watdajel</a>
    <a href="index.html" class="n-back">← Back</a>
  </div>
</nav>
<div class="page-body">
  <div class="page-center">
    <div class="page-tag">Over ons</div>
    <h1 class="page-title">About Watdajel</h1>
    <p class="page-sub">The story of Watdajel — from Lima to Utrecht.</p>
    <div class="page-note">This page is under construction. Content coming soon.</div>
  </div>
</div>
</body>
</html>
