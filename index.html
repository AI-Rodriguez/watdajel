<!DOCTYPE html>
<html lang="nl">
<head>

<title>Watdajel — Creative & Sustainable Workspaces</title>
<meta name="description" content="De perfecte ruimte voor iedereen die een toffe sustainable werkplek zoekt. Circulaire hub in het hart van Utrecht.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0F0F0F;--charcoal:#1A1A1A;--g800:#333;--g600:#6B6B6B;--g400:#9A9A9A;--g200:#E0E0E0;--g100:#F5F5F5;--warm:#F8F6F3;--white:#FFF;--burgundy:#6B1D3A;--purple:#5B4FC7;--purple-hover:#4A3FA6;--lavender:#EDE8F5;--lavender-soft:#F5F1FB;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;scroll-padding-top:72px}
body{font-family:var(--sans);color:var(--charcoal);background:var(--white)}

/* NAV */
.n{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .5s cubic-bezier(.16,1,.3,1)}
.n--t{background:transparent}
.n--s{background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.n-i{max-width:1320px;margin:0 auto;padding:0 48px;height:72px;display:flex;align-items:center;justify-content:space-between}
.n-logo{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.02em;text-decoration:none;transition:color .3s}
.n--t .n-logo{color:var(--white)} .n--s .n-logo{color:var(--burgundy)}
.n-links{display:flex;align-items:center;gap:4px}
.n-link{font-family:var(--sans);font-size:14px;font-weight:500;text-decoration:none;padding:8px 16px;border-radius:6px;transition:all .25s;cursor:pointer;background:none;border:none;white-space:nowrap}
.n--t .n-link{color:rgba(255,255,255,.8)} .n--t .n-link:hover{color:var(--white);background:rgba(255,255,255,.1)}
.n--s .n-link{color:var(--g600)} .n--s .n-link:hover{color:var(--charcoal);background:var(--g100)}
.n-lang{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.5px;padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .25s;background:none;border:1.5px solid;margin-left:8px}
.n--t .n-lang{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25)} .n--t .n-lang:hover{color:var(--white);border-color:rgba(255,255,255,.5)}
.n--s .n-lang{color:var(--g600);border-color:var(--g200)} .n--s .n-lang:hover{color:var(--charcoal);border-color:var(--charcoal)}
.n-cta{font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 28px;border-radius:6px;border:none;cursor:pointer;transition:all .3s;text-decoration:none;display:inline-block;margin-left:12px}
.n--t .n-cta{background:var(--white);color:var(--charcoal)} .n--t .n-cta:hover{background:rgba(255,255,255,.9);transform:translateY(-1px)}
.n--s .n-cta{background:var(--charcoal);color:var(--white)} .n--s .n-cta:hover{background:var(--black);transform:translateY(-1px)}
.n-burger{display:none;background:none;border:none;cursor:pointer;width:28px;height:20px;position:relative;flex-shrink:0}
.n-burger span{position:absolute;left:0;height:2px;width:100%;transition:all .35s cubic-bezier(.16,1,.3,1);border-radius:1px}
.n--t .n-burger span{background:var(--white)} .n--s .n-burger span{background:var(--charcoal)}
.n-burger span:nth-child(1){top:0} .n-burger span:nth-child(2){top:9px} .n-burger span:nth-child(3){top:18px}
.n-burger.open span:nth-child(1){top:9px;transform:rotate(45deg);background:var(--charcoal)}
.n-burger.open span:nth-child(2){opacity:0}
.n-burger.open span:nth-child(3){top:9px;transform:rotate(-45deg);background:var(--charcoal)}
.mm{position:fixed;inset:0;z-index:99;background:var(--white);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:48px;opacity:0;pointer-events:none;transition:opacity .4s}
.mm.open{opacity:1;pointer-events:all}
.mm a,.mm button{font-family:var(--serif);font-size:32px;font-weight:500;color:var(--charcoal);text-decoration:none;background:none;border:none;cursor:pointer;padding:10px 0;display:block;transition:color .2s}
.mm a:hover,.mm button:hover{color:var(--burgundy)}

/* HERO */
.hero{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:flex-end}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 8s ease-out}
.hero:hover .hero-bg{transform:scale(1.02)}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.5) 100%)}
.hero-c{position:relative;z-index:2;max-width:1320px;width:100%;margin:0 auto;padding:0 48px 80px}
.hero-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,.7);margin-bottom:20px;opacity:0;animation:fu .8s .3s ease forwards}
.hero-h{font-family:var(--serif);font-weight:600;font-size:clamp(48px,7vw,88px);line-height:1.05;color:var(--white);margin-bottom:20px;letter-spacing:-.02em;opacity:0;animation:fu .8s .5s ease forwards}
.hero-h em{font-style:italic;font-weight:400}
.hero-sub{font-family:var(--sans);font-size:17px;line-height:1.65;color:rgba(255,255,255,.8);max-width:520px;margin-bottom:36px;font-weight:400;opacity:0;animation:fu .8s .7s ease forwards}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fu .8s .9s ease forwards}
.btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:14px 32px;border-radius:6px;cursor:pointer;transition:all .3s;text-decoration:none;display:inline-block;border:none}
.btn-w{background:var(--white);color:var(--charcoal)} .btn-w:hover{background:rgba(255,255,255,.9);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.2)}
.btn-g{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,.4)} .btn-g:hover{border-color:var(--white);background:rgba(255,255,255,.08)}
.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fu .8s 1.2s ease forwards}
.hero-scroll span{font-family:var(--sans);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.5)}
.scroll-line{width:1px;height:40px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.scroll-line::after{content:'';position:absolute;top:-100%;left:0;width:1px;height:100%;background:var(--white);animation:sd 2s ease-in-out infinite}

/* GALLERY */
.gal{padding:80px 48px;background:var(--white);max-width:1320px;margin:0 auto}
.gal-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
.gal-t{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--charcoal);letter-spacing:-.02em}
.gal-nav{display:flex;gap:8px}
.gal-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--g200);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;font-size:18px;color:var(--charcoal)}
.gal-btn:hover{border-color:var(--charcoal);background:var(--charcoal);color:var(--white)}
.gal-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.gal-track::-webkit-scrollbar{display:none}
.gal-item{flex:0 0 auto;scroll-snap-align:start;width:380px;height:260px;border-radius:12px;overflow:hidden;cursor:pointer}
.gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1);display:block}
.gal-item:hover img{transform:scale(1.05)}

/* BOOKING */
.booking{padding:80px 48px;background:var(--lavender)}
.booking-in{max-width:720px;margin:0 auto}
.booking h2{font-family:var(--serif);font-size:clamp(32px,4vw,48px);font-weight:600;color:var(--burgundy);margin-bottom:8px;letter-spacing:-.02em}
.booking h2 em{color:var(--purple);font-style:italic}
.booking-sub{font-family:var(--sans);font-size:15px;color:var(--g600);margin-bottom:28px}
.booking-card{background:var(--white);border-radius:20px;padding:28px;box-shadow:0 4px 24px rgba(28,20,40,.06)}
.toggle{display:flex;background:#EFEBF5;border-radius:28px;padding:4px;margin-bottom:24px}
.toggle-btn{flex:1;padding:13px 24px;border-radius:24px;border:none;font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;background:transparent;color:var(--charcoal)}
.toggle-btn.on{background:var(--purple);color:var(--white);box-shadow:0 4px 16px rgba(91,79,199,.25)}
.booking-fields{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:20px}
.b-field{background:#F7F5FA;border-radius:14px;padding:15px 18px;display:flex;align-items:center;gap:12px;border:1.5px solid transparent;transition:border-color .2s}
.b-field:focus-within{border-color:var(--purple)}
.b-field svg{width:18px;height:18px;color:var(--purple);flex-shrink:0;stroke:var(--purple);fill:none}
.b-field input,.b-field select{border:none;background:transparent;font-family:var(--sans);font-size:15px;font-weight:500;color:var(--charcoal);outline:none;width:100%}
.b-search{width:100%;padding:16px;border-radius:24px;border:none;background:var(--purple);color:var(--white);font-family:var(--sans);font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;display:block;text-align:center;text-decoration:none}
.b-search:hover{background:var(--purple-hover);transform:translateY(-1px);box-shadow:0 8px 24px rgba(91,79,199,.3)}

/* INTRO */
.intro{padding:120px 48px;background:var(--warm)}
.intro-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.intro-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--burgundy);margin-bottom:20px}
.intro-t{font-family:var(--serif);font-size:clamp(28px,3.5vw,42px);font-weight:600;color:var(--charcoal);line-height:1.15;letter-spacing:-.02em;margin-bottom:24px}
.intro-txt{font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--g600)}
.intro-txt p{margin-bottom:16px}
.intro-img{border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.intro-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s;display:block}
.intro-img:hover img{transform:scale(1.03)}

/* SOLUTIONS */
.sol{padding:120px 48px;background:var(--white)}
.sol-in{max-width:1320px;margin:0 auto}
.sol-hd{text-align:center;margin-bottom:64px}
.sol-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--burgundy);margin-bottom:16px}
.sol-t{font-family:var(--serif);font-size:clamp(32px,4vw,48px);font-weight:600;color:var(--charcoal);letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
.sol-sub{font-family:var(--sans);font-size:17px;color:var(--g600);max-width:560px;margin:0 auto;line-height:1.65}
.sol-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.sc{border-radius:12px;overflow:hidden;background:var(--g100);transition:all .4s cubic-bezier(.16,1,.3,1);cursor:pointer;text-decoration:none;color:inherit;display:block}
.sc:hover{transform:translateY(-4px);box-shadow:0 24px 64px rgba(0,0,0,.08)}
.sc-img{width:100%;aspect-ratio:16/10;overflow:hidden}
.sc-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1);display:block}
.sc:hover .sc-img img{transform:scale(1.04)}
.sc-body{padding:24px 28px 28px}
.sc-t{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--charcoal);margin-bottom:10px;letter-spacing:-.01em}
.sc-d{font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--g600);margin-bottom:20px}
.sc-l{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--charcoal);display:inline-flex;align-items:center;gap:8px;transition:gap .25s}
.sc:hover .sc-l{gap:12px}
.sc-l svg{width:16px;height:16px}

/* CTA */
.cta{padding:100px 48px;background:var(--charcoal);text-align:center}
.cta-in{max-width:720px;margin:0 auto}
.cta-t{font-family:var(--serif);font-size:clamp(32px,4vw,52px);font-weight:600;color:var(--white);line-height:1.15;letter-spacing:-.02em;margin-bottom:20px}
.cta-p{font-family:var(--sans);font-size:17px;line-height:1.65;color:rgba(255,255,255,.6);margin-bottom:12px}
.cta-email{font-family:var(--sans);font-size:15px;color:rgba(255,255,255,.4);margin-bottom:36px}
.cta-email a{color:rgba(255,255,255,.6);text-decoration:underline;text-underline-offset:3px}
.cta-btn{font-family:var(--sans);font-size:15px;font-weight:600;padding:16px 40px;border-radius:6px;background:var(--white);color:var(--charcoal);border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:all .3s}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.3)}

/* FOOTER */
.ft{background:var(--black);color:rgba(255,255,255,.5);padding:64px 48px 32px}
.ft-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px}
.ft-brand{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--white);margin-bottom:12px}
.ft p{font-family:var(--sans);font-size:14px;line-height:1.7;margin-bottom:20px}
.ft-social{display:flex;gap:10px}
.ft-social a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;transition:all .3s}
.ft-social a:hover{background:var(--purple);transform:translateY(-2px)}
.ft-social svg{width:16px;height:16px;fill:rgba(255,255,255,.6)}
.ft-social a:hover svg{fill:var(--white)}
.ft h4{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--white);margin-bottom:16px}
.ft ul{list-style:none}
.ft li{margin-bottom:10px}
.ft li a{color:rgba(255,255,255,.45);text-decoration:none;font-family:var(--sans);font-size:14px;transition:color .2s}
.ft li a:hover{color:rgba(255,255,255,.8)}
.ft-bot{max-width:1320px;margin:40px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px}

@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sd{0%{top:-100%}50%{top:100%}100%{top:100%}}

@media(max-width:1024px){
  .n-links{display:none}.n-burger{display:block}
  .intro-in,.sol-grid{grid-template-columns:1fr}
  .intro-in{gap:40px}.gal-item{width:300px;height:200px}
  .ft-in{grid-template-columns:1fr}
  .booking-fields{grid-template-columns:1fr}
}
@media(max-width:640px){
  .n-i{padding:0 24px}.hero-c{padding:0 24px 60px}
  .gal,.intro,.sol,.booking,.cta,.ft{padding-left:24px;padding-right:24px}
  .hero-h{font-size:40px}.gal-item{width:260px;height:180px}
  .mm{padding:24px}.mm a,.mm button{font-size:28px}
  .ft-bot{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>
