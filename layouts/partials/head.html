<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .title }}</title>
<meta name="description" content="{{ .description }}">
<meta property="og:title" content="{{ .title }}">
<meta property="og:description" content="{{ .ogDescription }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .ctx.Site.BaseURL }}">
<meta property="og:image" content="{{ .ctx.Site.BaseURL }}media/render-aerial.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0F0F0F;--charcoal:#1A1A1A;--g600:#6B6B6B;--g400:#9B9B9B;--g200:#E0E0E0;--g100:#F5F5F5;
  --warm:#F8F6F3;--white:#FFF;--burgundy:#6B1D3A;--forest:#2E5A43;--purple:#5B4FC7;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',-apple-system,sans-serif;
  --pill:50px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;scroll-padding-top:72px}
body{font-family:var(--sans);color:var(--charcoal);background:var(--white)}

/* ── NAV ── */
.n{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .5s cubic-bezier(.16,1,.3,1)}
.n--t{background:transparent}
.n--s{background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 1px 0 rgba(0,0,0,.06)}
.n-i{max-width:1320px;margin:0 auto;padding:0 48px;height:72px;display:flex;align-items:center;justify-content:space-between}
.n-logo{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.02em;text-decoration:none;transition:color .3s}
.n--t .n-logo{color:var(--white)}.n--s .n-logo{color:var(--burgundy)}
.n-links{display:flex;align-items:center;gap:4px}
.n-link{font-family:var(--sans);font-size:14px;font-weight:500;padding:8px 18px;border-radius:var(--pill);transition:all .25s;cursor:pointer;background:none;border:none;white-space:nowrap;text-decoration:none;display:inline-block}
.n--t .n-link{color:rgba(255,255,255,.8)}.n--t .n-link:hover{color:var(--white);background:rgba(255,255,255,.12)}
.n--s .n-link{color:var(--g600)}.n--s .n-link:hover{color:var(--charcoal);background:var(--g100)}
.n-lang{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.5px;padding:7px 16px;border-radius:var(--pill);cursor:pointer;transition:all .25s;background:none;border:1.5px solid;margin-left:8px}
.n--t .n-lang{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25)}.n--t .n-lang:hover{color:var(--white);border-color:rgba(255,255,255,.5)}
.n--s .n-lang{color:var(--g600);border-color:var(--g200)}.n--s .n-lang:hover{color:var(--charcoal);border-color:var(--charcoal)}
.n-cta{font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 26px;border-radius:var(--pill);border:none;cursor:pointer;transition:all .3s;text-decoration:none;display:inline-block;margin-left:12px}
.n--t .n-cta{background:var(--white);color:var(--charcoal)}.n--t .n-cta:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.n--s .n-cta{background:var(--charcoal);color:var(--white)}.n--s .n-cta:hover{background:var(--black);transform:translateY(-1px)}
.n-burger{display:none;background:none;border:none;cursor:pointer;width:28px;height:20px;position:relative}
.n-burger span{position:absolute;left:0;height:2px;width:100%;transition:all .35s cubic-bezier(.16,1,.3,1);border-radius:1px}
.n--t .n-burger span{background:var(--white)}.n--s .n-burger span{background:var(--charcoal)}
.n-burger span:nth-child(1){top:0}.n-burger span:nth-child(2){top:9px}.n-burger span:nth-child(3){top:18px}
.n-burger.open span:nth-child(1){top:9px;transform:rotate(45deg);background:var(--charcoal)}
.n-burger.open span:nth-child(2){opacity:0}
.n-burger.open span:nth-child(3){top:9px;transform:rotate(-45deg);background:var(--charcoal)}
.mm{position:fixed;inset:0;z-index:99;background:var(--white);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:48px;opacity:0;pointer-events:none;transition:opacity .4s}
.mm.open{opacity:1;pointer-events:all}
.mm a,.mm button{font-family:var(--serif);font-size:32px;font-weight:500;color:var(--charcoal);background:none;border:none;cursor:pointer;padding:10px 0;display:block;transition:color .2s;text-decoration:none}
.mm a:hover,.mm button:hover{color:var(--burgundy)}
.mm-lang{font-family:var(--sans)!important;font-size:18px!important;color:var(--g600)!important;margin-top:24px!important}
.mm-cta{font-family:var(--sans)!important;font-size:20px!important;color:var(--burgundy)!important;margin-top:8px!important;text-decoration:none!important}

/* ── HERO ── */
.hero{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:flex-end;padding-top:72px}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.6) 100%)}
.hero-c{position:relative;z-index:2;max-width:1320px;width:100%;margin:0 auto;padding:0 48px 100px}
.hero-h{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(22px,2.8vw,33px);line-height:1.2;color:var(--white);margin-bottom:32px;letter-spacing:.01em;opacity:0;animation:fu .9s .3s ease forwards}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fu .9s .6s ease forwards}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:13px 30px;border-radius:var(--pill);cursor:pointer;transition:all .3s;text-decoration:none;display:inline-block;border:none;letter-spacing:.01em}
.btn-w{background:var(--white);color:var(--charcoal)}.btn-w:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.25)}
.btn-outline{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,.45)}.btn-outline:hover{border-color:var(--white);background:rgba(255,255,255,.1)}
.hero-scroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fu .8s 1.1s ease forwards}
.hero-scroll span{font-family:var(--sans);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:2.5px;color:rgba(255,255,255,.5)}
.scroll-line{width:1px;height:40px;background:rgba(255,255,255,.25);position:relative;overflow:hidden}
.scroll-line::after{content:'';position:absolute;top:-100%;left:0;width:1px;height:100%;background:var(--white);animation:sd 2s ease-in-out infinite}

/* ── STEENWEG ── */
.stw{width:100%;background:var(--white);padding:110px 0 120px}
.stw-carousel{position:relative;aspect-ratio:16/9;background:var(--white)}
.stw-carousel img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .8s ease;position:absolute;top:0;left:0}
.stw-carousel img.active{opacity:1}
.stw-dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:2}
.stw-dot{width:9px;height:9px;border-radius:50%;background:rgba(26,26,26,.22);border:none;padding:0;cursor:pointer;transition:background .3s}
.stw-dot.active{background:rgba(26,26,26,.65)}
.stw-partners{margin:0}
.stw-partners img{width:100%;display:block}

.stw-content{max-width:1200px;margin:0 auto 120px;padding:0 48px;display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.stw-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--forest);margin-bottom:20px}
.stw-headline{font-family:var(--serif);font-size:clamp(28px,3.5vw,44px);font-weight:600;color:var(--charcoal);line-height:1.15;letter-spacing:-.02em;margin-bottom:24px}
.stw-text{font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--g600);margin-bottom:32px}
.stw-btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:13px 30px;border-radius:50px;border:1.5px solid var(--charcoal);color:var(--charcoal);text-decoration:none;display:inline-block;transition:all .3s}
.stw-btn:hover{background:var(--charcoal);color:var(--white)}
.stw-photo{width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--g100)}
.stw-photo img{width:100%;height:100%;object-fit:cover;display:block}

/* ── INTRO ── */
.intro{background:var(--white);padding:0 48px 120px}
.intro-in{max-width:820px;margin:0 auto;text-align:center}
.intro-t{font-family:var(--serif);font-size:clamp(28px,3.5vw,44px);font-weight:600;color:var(--charcoal);line-height:1.15;letter-spacing:-.02em;margin-bottom:24px}
.intro-sub{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(22px,2.6vw,30px);color:var(--charcoal);line-height:1.35;margin-bottom:32px}
.intro-text{font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--g600)}

/* ── JESUS BLOCK ── */
.jesus{padding:110px 48px;background:var(--warm)}
.jesus-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:3fr 2fr;gap:72px;align-items:center}
.jesus-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--forest);margin-bottom:24px}
.jesus-headline{font-family:var(--serif);font-size:clamp(28px,3.5vw,44px);font-weight:600;color:var(--charcoal);line-height:1.3;letter-spacing:-.02em;margin-bottom:24px}
.jesus-text{font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--g600)}
.jesus-text:first-of-type{margin-bottom:20px}
.jesus-photo{width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--g100);display:flex;align-items:center;justify-content:center;text-decoration:none}
.jesus-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.jesus-ph{font-family:var(--serif);font-size:16px;color:var(--g400);font-style:italic;text-align:center;padding:24px}
.jesus-cta{margin-top:16px;text-align:center}
.jesus-cta a{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--g600);text-decoration:none;letter-spacing:.5px;border-bottom:1px solid var(--g200);padding-bottom:3px;transition:all .25s}
.jesus-cta a:hover{color:var(--charcoal);border-color:var(--charcoal)}

/* ── SOLUTIONS ── */
.sol{padding:100px 48px;background:var(--white)}
.sol-in{max-width:1320px;margin:0 auto}
.sol-hd{text-align:center;margin-bottom:56px}
.sol-tag{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:3px;color:var(--forest);margin-bottom:16px}
.sol-t{font-family:var(--serif);font-size:clamp(30px,4vw,46px);font-weight:600;color:var(--charcoal);letter-spacing:-.02em;line-height:1.15;margin-bottom:14px}
.sol-sub{font-family:var(--sans);font-size:16px;color:var(--g600);max-width:520px;margin:0 auto;line-height:1.65}
.sol-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.sc{border-radius:12px;overflow:hidden;background:var(--g100);transition:all .4s cubic-bezier(.16,1,.3,1);cursor:pointer;text-decoration:none;color:inherit;display:block}
.sc:hover{transform:translateY(-4px);box-shadow:0 24px 64px rgba(0,0,0,.08)}
.sc-img{width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--g200)}
.sc-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.16,1,.3,1);display:block}
.sc:hover .sc-img img{transform:scale(1.04)}
.sc-body{padding:24px 28px 28px}
.sc-t{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--charcoal);margin-bottom:10px}
.sc-d{font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--g600);margin-bottom:20px}
.sc-l{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--charcoal);display:inline-flex;align-items:center;gap:8px;transition:gap .25s}
.sc:hover .sc-l{gap:12px}

/* ── VERGADERING ── */

/* ── FOOTER ── */
.ft{background:var(--black);color:rgba(255,255,255,.5);padding:64px 48px 32px}
.ft-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px}
.ft-brand{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--white);margin-bottom:12px}
.ft-legal{font-family:var(--sans);font-size:13px;color:rgba(255,255,255,.5);line-height:1.8;margin:0}
.ft-label{font-family:var(--sans);font-size:12px;color:rgba(255,255,255,.4);margin-top:12px;font-style:italic}
.ft p{font-family:var(--sans);font-size:14px;line-height:1.7;margin-bottom:20px}
.ft-social{display:flex;gap:10px;margin-top:4px}
.ft-social a,.ft-social span{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;transition:all .3s}
.ft-social a{cursor:pointer;text-decoration:none}
.ft-social span{cursor:default}
.ft-social a:hover{background:var(--burgundy);transform:translateY(-2px)}
.ft-social svg{width:16px;height:16px;fill:rgba(255,255,255,.55)}
.ft-social a:hover svg{fill:var(--white)}
.ft h4{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--white);margin-bottom:16px}
.ft ul{list-style:none}.ft li{margin-bottom:10px}
.ft li a{color:rgba(255,255,255,.45);text-decoration:none;font-family:var(--sans);font-size:14px;transition:color .2s}
.ft li a:hover{color:rgba(255,255,255,.8)}
.ft-bot{max-width:1320px;margin:40px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px}

/* ── ANIMATIONS ── */
@keyframes fu{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sd{0%{top:-100%}50%{top:100%}100%{top:100%}}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .n-links{display:none}.n-burger{display:block}
  .jesus-in,.stw-content{grid-template-columns:1fr;gap:40px}
  .sol-grid{grid-template-columns:1fr}
  .ft-in{grid-template-columns:1fr}
}
@media(max-width:640px){
  .n-i{padding:0 24px}.hero-c{padding:0 24px 72px}

  .intro,.jesus,.sol,.ft{padding-left:24px;padding-right:24px}
  .stw-content{padding-left:24px;padding-right:24px}
  .hero-h{font-size:22px}
  .mm{padding:24px}.mm a,.mm button{font-size:26px}
  .ft-bot{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>
